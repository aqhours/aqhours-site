name: archivebox

services:
  archivebox:
    image: ${ARCHIVEBOX_IMAGE:-archivebox/archivebox:0.7.4}
    command: server --quick-init 0.0.0.0:8000
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./data:/data
    environment:
      ALLOWED_HOSTS: archivebox.aqhours.cn
      CSRF_TRUSTED_ORIGINS: https://archivebox.aqhours.cn
      PUBLIC_INDEX: "False"
      PUBLIC_SNAPSHOTS: "False"
      PUBLIC_ADD_VIEW: "False"
      SAVE_WGET: "False"
      SAVE_DOM: "False"
      SAVE_ARCHIVE_DOT_ORG: "False"
      SAVE_FAVICON: "False"
      TZ: Asia/Shanghai
      PUID: ${PUID:-1003}
      PGID: ${PGID:-1003}
    shm_size: "1gb"
    stop_grace_period: 1m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-H", "Host: archivebox.aqhours.cn", "http://127.0.0.1:8000/admin/login/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 2m
    networks:
      aqhours-web:
        aliases:
          - archivebox-app

networks:
  aqhours-web:
    external: true
    name: aqhours-web
