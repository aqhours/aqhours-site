name: headscale

services:
  headscale:
    image: docker.io/headscale/headscale:0.29.1
    command: serve
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/run/headscale
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    ports:
      - "3478:3478/udp"
    volumes:
      - ./config:/etc/headscale:ro
      - ./data:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      aqhours-web:
        aliases:
          - headscale-app

networks:
  aqhours-web:
    external: true
    name: aqhours-web
