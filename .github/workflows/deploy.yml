name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: homepage-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm run typecheck

      - name: Build static site
        env:
          # Compile both build-time map providers without storing or exercising real keys.
          NEXT_PUBLIC_MAP_PROVIDER: amap
          NEXT_PUBLIC_AMAP_API_KEY: github-actions-validation-not-a-real-key
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: github-actions-validation-not-a-real-key
          NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID: DEMO_MAP_ID
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: https://analytics.example.com/script.js
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: 00000000-0000-0000-0000-000000000000
        run: pnpm run build
